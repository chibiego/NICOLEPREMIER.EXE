<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NICOLE PREMIER</title><link rel="stylesheet" href="style.css"></head>
<body><main id="game" class="pc98">
  <section class="screen">
    <div id="scene" class="scene"><div id="notice" class="notice">系统已连接。请完成今日观察工作。</div><div class="lab-id">LABORATORY N-01<br>SUBJECT: NICOLE PREMIER</div>
    <div class="premier">
    <img id="charImg" src="experiment1.png" alt="Premier">
</div>
    <div class="dialogue"><div class="nameplate">NICOLE PREMIER</div><div id="dialogue"><p>“……早上好。”</p></div></div>
  </section>
  <aside class="side"><div class="title">COMMAND MENU</div><div id="actions" class="actions"></div><div class="points">行动点 <strong id="points">3</strong> / 3</div><div class="tube-log"><div class="tube-title">EXPERIMENT LOG</div><ol id="logList"><li>Hello Premier！等待记录。</li></ol></div></aside>
  <footer class="status"><div class="day" id="day">DAY 01 · 上午</div><div class="stat"><label>TRUST</label><div><b id="trustBar"></b></div><output id="trust">20</output></div><div class="stat nicole"><label>NICOLE</label><div><b id="nicoleBar"></b></div><output id="nicole">8</output></div><div class="stat mood"><label>EMOTION</label><div><b id="moodBar"></b></div><output id="mood">65</output></div><div class="rating">实验进度 <strong id="rating">0</strong><small>/100</small></div></footer>
</main>
<div id="bookModal" class="modal hidden">
  <div class="paper books">
    <div class="title">BOOK_SELECTION.EXE</div> 
    
    <button class="close" id="closeBook">×</button>
    
    <p class="paper-title">选择一本书</p>
    <div id="bookList"></div>
  </div>
</div><div hidden id="logModal"></div><button hidden id="saveLog"></button><button hidden id="closeLog"></button><textarea hidden id="logInput"></textarea>
<div id="finalModal" class="modal hidden final"><div id="finalText" class="final-text"></div><button id="finalButton" class="primary hidden">开始实验</button></div><div id="endCard" class="end-card hidden">NICOLE PREMIER<br><strong>END</strong></div><script src="game.js"></script></body></html>
